[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cxr-multimodal-report-grounder"
version = "2.0.0"
description = "CXR-Grounder: Chest X-Ray Vision-Language Finding Localization Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
cxr-multimodal-report-grounder = "cxr_grounder.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/cxr-multimodal-report-grounder"
Repository = "https://github.com/abusuraihsakhri/cxr-multimodal-report-grounder.git"
