version: '3.8'

services:
  cxr-multimodal-report-grounder:
    build: .
    container_name: cxr-multimodal-report-grounder
    ports:
      - "8000:8000"
    environment:
      MODEL_PROVIDER: mock
      AUDIT_SECRET_KEY: ${AUDIT_SECRET_KEY:?Set AUDIT_SECRET_KEY before starting the service}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
