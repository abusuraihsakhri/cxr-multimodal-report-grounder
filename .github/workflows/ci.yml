name: Cxr Multimodal Report Grounder CI/CD & Security Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip "setuptools>=83"
        pip install -e '.[test]'

    - name: Audit installed Python dependencies
      run: |
        python -m pip install pip-audit
        pip-audit

    - name: Run Pytest Suite
      run: |
        pytest -v

    - name: Check Python syntax
      run: python -m compileall -q agents cxr_grounder cli.py enrichment.py

    - name: Test browser module syntax and grounding
      run: |
        node --check web/app.mjs
        node --check web/grounding.mjs
        node --test web/grounding.test.mjs

    - name: Security audit regression
      run: python -m pytest -q tests/test_regressions.py

    - name: Audit trail integrity check
      run: |
        python -c "
        from agents.base import PHIGuard, AuditLogger
        import pytest
        assert AuditLogger.verify_integrity() is True
        print('Security & Zero-PHI Audit Passed!')
        "
